<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/css/heatmapStyle.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

<div id="stockModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <iframe id="modalFrame" src="" style="width:100%; height:600px; border:none;"></iframe>
  </div>
</div>

<div style="margin:10px;">
  <input type="text" id="symbolSearch" placeholder="Enter stock symbol" />
  <button id="searchBtn">Search</button>
</div>



  
<div id="chart"></div>

<script th:inline="javascript">
  let heatmapData = [[${quotesJson}]];
  heatmapData = JSON.parse(heatmapData);

  

  function formatMarketCap(value) {
    if (value >= 1e12) return (value / 1e12).toFixed(2) + "T";
    if (value >= 1e9) return (value / 1e9).toFixed(2) + "B";
    if (value >= 1e6) return (value / 1e6).toFixed(2) + "M";
    if (value >= 1e3) return (value / 1e3).toFixed(2) + "K";
    return value.toString();
  }

  function dynamicFontSize() {
    return Math.max(12, Math.min(24, window.innerWidth / 100));
  }

  function renderHeatmap(data) {
    const globalMinChange = Math.min(...data.map(d => d.percentChange));
    const globalMaxChange = Math.max(...data.map(d => d.percentChange));

    const maxAbsChange = Math.max(Math.abs(globalMinChange), Math.abs(globalMaxChange));


    let labels = [];
    let parents = [];
    let values = [];
    let colors = [];
    let texts = [];
    let hovertexts = [];

    const industries = [...new Set(data.map(d => d.industry))];
    industries.forEach(ind => {
      labels.push(ind);
      parents.push("");
      values.push(
        data.filter(d => d.industry === ind)
            .reduce((sum, d) => sum + d.marketCapitalization, 0)
      );
      colors.push(null);
      texts.push("");
      hovertexts.push("Industry: " + ind);

    });

    data.forEach(d => {
      labels.push(d.symbol);
      parents.push(d.industry);
      values.push(d.marketCapitalization);
      colors.push(d.percentChange);

      const arrow = d.percentChange >= 0
        ? "<span style='color:#22ff00ff'>▲ " + d.percentChange.toFixed(2) + "%</span>"
        : "<span style='color:#ff0000ff'>▼ " + d.percentChange.toFixed(2) + "%</span>";

      texts.push(`${d.symbol}<br>$${d.price.toFixed(2)}<br>${arrow}`);

      hovertexts.push(
        `Company: ${d.name}<br>` +
        `Industry: ${d.industry}<br>` +
        `Price: $${d.price.toFixed(2)}<br>` +
        `Change: ${d.priceChange.toFixed(2)}<br>` +
        `Percent Change: ${d.percentChange.toFixed(2)}%<br>` +
        `Market Cap: ${formatMarketCap(d.marketCapitalization)}<br>` +
        `IPO Date: ${d.ipo}<br>` +
        `Shares Outstanding: ${d.shareOutstanding}<br>` +
        `<a href='${d.webUrl}' target='_blank'>Website</a>`
      );

    });

    const plotData = [{
      type: "treemap",
      labels,
      parents,
      values,
      branchvalues: "total",
      marker: {
        colors,
        colorscale: [
          [0, "#ff0000ff"],
          [0.5, "#797979ff"],
          [1, "#22ff00ff"]
        ],
        cmin: -maxAbsChange,
        cmax: maxAbsChange,
        colorbar: {
          title: "Percent Change (%)",
          tickfont: { color: "#ffffffff" },
          titlefont: { color: "#ffffff" }
        }
      },
      text: texts,
      textinfo: "text",
      hovertext: hovertexts,
      hoverinfo: "text",
      textfont: { size: dynamicFontSize() },
      tiling: { pad: 5 }
    }];

    const layout = {
      autosize: true,
      margin: { t: 0, l: 0, r: 0, b: 0 },
      paper_bgcolor: "#5a5959ff",
      plot_bgcolor: "#5a5959ff",
      hoverlabel: { bgcolor: "#333333", font: { color: "#ffffff" } },
      uniformtext: { minsize: dynamicFontSize() , mode: "hide" }
    };

    Plotly.react("chart", plotData, layout, { staticPlot: true });

  }

  async function loadHeatmap() {
    try {
      const response = await fetch("/api/heatmap");
      const newData = await response.json();
      renderHeatmap(newData);
    } catch (error) {
      console.error("Failed to load heatmap:", error);
    }
  }

  // Initial render
  renderHeatmap(heatmapData);

  // Auto update every 30s
  setInterval(loadHeatmap, 30000);

  // Resize handler
  window.onresize = () => Plotly.Plots.resize(document.getElementById("chart"));

  // Click handler
document.getElementById("chart").on('plotly_click', function(eventData) {

  
  const stock = eventData.points[0].label;
  const industryName = eventData.points[0].parent;

  if (industryName) {
    const modal = document.getElementById("stockModal");
    const frame = document.getElementById("modalFrame");

    // Load the OHLC page inside the modal
    frame.src = "/data/ohlc?symbol=" + encodeURIComponent(stock);

    // Show modal
    modal.style.display = "block";

    // Close button
    document.querySelector(".close").onclick = () => {
      modal.style.display = "none";
      frame.src = ""; // clear frame when closing
    };

    // Close when clicking outside
    window.onclick = (event) => {
      if (event.target === modal) {
        modal.style.display = "none";
        frame.src = "";
      }
    };
  }
});

// Search button handler
document.getElementById("searchBtn").onclick = () => {
  const symbol = document.getElementById("symbolSearch").value.trim();
  if (symbol) {
    const modal = document.getElementById("stockModal");
    const frame = document.getElementById("modalFrame");

    // Load candlestick plot page for the symbol
    frame.src = "/data/ohlc?symbol=" + encodeURIComponent(symbol);

    // Show modal
    modal.style.display = "block";

    // Close button
    document.querySelector(".close").onclick = () => {
      modal.style.display = "none";
      frame.src = "";
    };

    // Close when clicking outside
    window.onclick = (evt) => {
      if (evt.target === modal) {
        modal.style.display = "none";
        frame.src = "";
      }
    };
  }
};


</script>
</body>
</html>
