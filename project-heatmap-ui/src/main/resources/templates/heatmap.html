<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/css/heatmapStyle.css">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

<div id="stockModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <iframe id="modalFrame" src="" style="width:100%; height:600px; border:none;"></iframe>
  </div>
</div>

<div style="margin:10px;">
  <input type="text" id="symbolSearch" list="symbolList" placeholder="Enter stock symbol" />
  <datalist id="symbolList"></datalist>
  <button id="searchBtn">Search</button>
</div>


<div id="lastUpdated" style="margin:10px; color:#ffffff; font-size:14px;">
  Last updated: never
</div>
<div id="chart"></div>


  
<div id="chart"></div>

<script th:inline="javascript">
  let heatmapData = [[${quotesJson}]];
  heatmapData = JSON.parse(heatmapData);

    // create symbol list
  const symbols = heatmapData.map(d => d.symbol).sort();
  const datalist = document.getElementById("symbolList");
  symbols.forEach(sym => {
    const option = document.createElement("option");
    option.value = sym;
    datalist.appendChild(option);
  });
  


  function formatMarketCap(value) {
    if (value >= 1e12) return (value / 1e12).toFixed(2) + "T";
    if (value >= 1e9) return (value / 1e9).toFixed(2) + "B";
    if (value >= 1e6) return (value / 1e6).toFixed(2) + "M";
    if (value >= 1e3) return (value / 1e3).toFixed(2) + "K";
    return value.toString();
  }

  function dynamicFontSize() {
    return Math.max(10, Math.min(24, window.innerWidth / 100));
  }

function renderHeatmap(data) {


  let labels = [], parents = [], values = [], colors = [], texts = [], hovertexts = [];

  const industries = [...new Set(data.map(d => d.industry))];
  industries.forEach(ind => {
    labels.push(ind);
    parents.push("");
    values.push(
      data.filter(d => d.industry === ind)
          .reduce((sum, d) => sum + d.marketCapitalization, 0)
    );
    colors.push(null);
    texts.push("");
    hovertexts.push("Industry: " + ind);
  });

  data.forEach(d => {
    labels.push(d.symbol);
    parents.push(d.industry);
    values.push(d.marketCapitalization);
    colors.push(d.percentChange);

    let blockText = "";
    if (d.marketCapitalization > 1e5) {
      const arrow = d.percentChange >= 0
        ? "<span style='color:#22ff00ff; text-shadow:1px 1px 2px #00000064;'>▲ " + d.percentChange.toFixed(2) + "%</span>"
        : "<span style='color:#ff0000ff; text-shadow:1px 1px 2px #00000064;'>▼ " + d.percentChange.toFixed(2) + "%</span>";
      blockText = `${d.symbol}<br>$${d.price.toFixed(2)}<br>${arrow}`;
    } else if (d.marketCapitalization > 1e3) {
      blockText = d.symbol;
    }
    texts.push(blockText);

    hovertexts.push(
      `Company: ${d.name}<br>` +
      `Industry: ${d.industry}<br>` +
      `Price: $${d.price.toFixed(2)}<br>` +
      `Change: ${d.priceChange.toFixed(2)}<br>` +
      `Percent Change: ${d.percentChange.toFixed(2)}%<br>` +
      `Market Cap: ${formatMarketCap(d.marketCapitalization)}<br>` +
      `IPO Date: ${d.ipo}<br>` +
      `Shares Outstanding: ${d.shareOutstanding}<br>`
    );
  });

  const plotData = [{
    type: "treemap",
    labels, parents, values,
    maxdepth: 2,
    branchvalues: "total",
    root: { color: "#000000" },
    marker: {
      colors,
      colorscale: [
        [0, "#ff0000ff"],
        [0.5, "#797979ff"],
        [1, "#22ff00ff"]
      ],
      cmin: -6,
      cmax: 6,
      colorbar: {
        title: "Percent Change (%)",
        tickfont: { color: "#ffffffff" },
        titlefont: { color: "#ffffff" }
      }
    },
    text: texts,
    textinfo: "text",
    hovertext: hovertexts,
    hoverinfo: "text",
    textfont: { size: dynamicFontSize(), color: "#ffffff" },
    tiling: { pad: 5 }
  }];

  const layout = {
    xaxis: { fixedrange: true },
    yaxis: { fixedrange: true },
    autosize: true,
    margin: { t: 0, l: 0, r: 0, b: 0 },
    paper_bgcolor: "#5a5959ff",
    plot_bgcolor: "#5a5959ff",
    hoverlabel: { bgcolor: "#333333", font: { color: "#ffffff" } },
    uniformtext: { minsize: dynamicFontSize() }
  };

  const chartDiv = document.getElementById("chart");
  const currentLayout = chartDiv.layout ? JSON.parse(JSON.stringify(chartDiv.layout)) : null;

  Plotly.react("chart", plotData, layout, {
    staticPlot: true,
    scrollZoom: false,
    doubleClick: false,
    displayModeBar: false
  }).then(() => {
    if (currentLayout) {
      Plotly.relayout("chart", currentLayout);
    }
  });
}

  async function loadHeatmap() {
    try {
      const response = await fetch("/json/heatmap");
      const newData = await response.json();
      renderHeatmap(newData);

    const now = new Date();
    document.getElementById("lastUpdated").textContent =
      "Last updated: " + now.toLocaleString();
  } catch (error) {
    console.error("Failed to load heatmap:", error);
  }

  }

  // Initial render
  renderHeatmap(heatmapData);

  // Auto update every 30s
  setInterval(loadHeatmap, 30000);

  // Resize handler
  window.onresize = () => Plotly.Plots.resize(document.getElementById("chart"));

  // Click handler
document.getElementById("chart").on('plotly_treemapclick', function(eventData) {



  
  const stock = eventData.points[0].label;
  const industryName = eventData.points[0].parent;

  if (stock && industryName) {  //happen only when clicking child block
    eventData.event.preventDefault();
    eventData.event.stopPropagation();
    const modal = document.getElementById("stockModal");
    const frame = document.getElementById("modalFrame");

    // Load the OHLC page inside the modal
    frame.src = "/data/ohlc?symbol=" + encodeURIComponent(stock);

    // Show modal
    modal.style.display = "block";

    // Close button
    document.querySelector(".close").onclick = () => {
      modal.style.display = "none";
      frame.src = ""; // clear frame when closing
    };

    // Close when clicking outside
    window.onclick = (event) => {
      if (event.target === modal) {
        modal.style.display = "none";
        frame.src = "";
      }
    };
    return false; //stop zooming when clicking child block
  }
});

// Search button handler
document.getElementById("searchBtn").onclick = () => {
  const symbol = document.getElementById("symbolSearch").value.trim().toUpperCase();
  if (symbols.includes(symbol)) {
    const modal = document.getElementById("stockModal");
    const frame = document.getElementById("modalFrame");

    // Load candlestick plot page for the symbol
    frame.src = "/data/ohlc?symbol=" + encodeURIComponent(symbol);

    // Show modal
    modal.style.display = "block";

    // Close button
    document.querySelector(".close").onclick = () => {
      modal.style.display = "none";
      frame.src = "";
    };

    // Close when clicking outside
    window.onclick = (evt) => {
      if (evt.target === modal) {
        modal.style.display = "none";
        frame.src = "";
      }
    };
  }else{
    alert("Symbol not found. Please search from the list.")
  }
};


</script>
</body>
</html>
