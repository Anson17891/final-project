services:
  data-provider-app:
    image: project-data-provider:0.0.1  #compose find image
    container_name: data-provider-app   #by image, generate container
    networks:
      - bootcamp-network
    ports:
      - "8181:8081"


  stock-data-app:
    image: project-stock-data:0.0.1  #compose find image
    container_name: stock-data-app   #by image, generate container
    networks:
      - bootcamp-network
    ports:
      - "8182:8082"

  postgres:
    image: postgres:15
    container_name: postgres-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin1234
      POSTGRES_DB: bootcamp_2510p
      PGDATA: /var/lib/postgresql/data/pgdata15
    networks:
      - bootcamp-network
    ports:
      - "5532:5432"
    volumes:
      - "./pgdata:/var/lib/postgresql/data/pgdata"

  redis:
    image: redis:7.0
    container_name: redis-container
    networks:
      - bootcamp-network
    ports:
      - "6479:6379"
    volumes:
      - "./redis_data:/data"

networks:
  bootcamp-network:
    driver: bridge